<!DOCTYPE html>
<!-- Built from settings-mockup.png. The DESIGN DIVERGENCE table is at the top of styles.css. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account settings - Fieldnote</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <aside class="sidebar">
    <a class="logo" href="#">Fieldnote</a>
    <nav class="nav" aria-label="Main">
      <ul>
        <li><a href="#">Notebooks</a></li>
        <li><a href="#">Shared with me</a></li>
        <li><a href="#" aria-current="page">Settings</a></li>
        <li><a href="#">Billing</a></li>
        <li><a href="#">Help</a></li>
      </ul>
    </nav>
  </aside>

  <main class="main">
    <h1 class="page-title">Account settings</h1>
    <!-- "imediately" is spelled this way in the source image. Kept as drawn. -->
    <p class="page-subtitle">Changes apply to all your notebooks imediately.</p>

    <!-- Placeholder: 56 x 56 circle, #d6cfbe. The source shows no photo, initials or icon. -->
    <div class="avatar" role="img" aria-label="Profile photo placeholder"></div>

    <form class="settings-form" action="#" method="post">

      <fieldset class="section section--profile">
        <legend class="section-label">Profile</legend>

        <div class="field-row">
          <div class="field">
            <label for="first-name">First name</label>
            <input id="first-name" name="first-name" type="text" value="Meera" autocomplete="given-name">
          </div>
          <div class="field">
            <label for="last-name">Last name</label>
            <input id="last-name" name="last-name" type="text" value="Varghese" autocomplete="family-name">
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" value="meera@fieldnote.example" autocomplete="email">
        </div>

        <div class="field">
          <label for="display-name">Display name</label>
          <input id="display-name" name="display-name" type="text" value="Meera V." autocomplete="nickname">
        </div>
      </fieldset>

      <fieldset class="section section--preferences">
        <legend class="section-label">Preferences</legend>

        <div class="field">
          <label for="language">Language</label>
          <input id="language" name="language" type="text" value="English (India)">
        </div>

        <div class="field">
          <label for="time-zone">Time zone</label>
          <input id="time-zone" name="time-zone" type="text" value="Asia/Kolkata (UTC+05:30)">
        </div>

        <div class="field">
          <label for="week-start">Week starts on</label>
          <input id="week-start" name="week-start" type="text" value="Monday">
        </div>
      </fieldset>

      <div class="actions">
        <button class="button button--primary" type="submit">Save changes</button>
        <button class="button button--quiet" type="button">Cancel</button>
      </div>

    </form>
  </main>

</body>
</html>
